<style>
  :root{
    --bg:#0a0f2e;--surface:#141d4d;--surface-2:#1b2763;--surface-3:#22307a;
    --line:rgba(150,172,255,.24);--line-strong:rgba(150,172,255,.45);
    --text:#ffffff;--dim:#cdd5f3;--faint:#93a0cf;
    --blue:#5b7cff;--blue-2:#3550f0;--cyan:#22e1ff;--violet:#b07cff;--green:#2ee6a6;--amber:#ffc046;--pink:#ff5fa8;--red:#ff6b7a;
    --font-head:"Space Grotesk","Segoe UI",sans-serif;--font-body:"Inter","Segoe UI",Arial,sans-serif;--font-mono:"JetBrains Mono",Consolas,monospace;
    --tk:#326EDC;--tk-d:#2457C5;--tk-bg:#F2F3F5;--tk-ink:#1F2430;--tk-dim:#6B7180;--tk-green:#1FA463;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.55;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}

  /* ---------- fondo ---------- */
  .bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    background:radial-gradient(900px 600px at 0% 0%,rgba(53,80,240,.55),transparent 60%),radial-gradient(700px 500px at 100% 20%,rgba(34,225,255,.28),transparent 60%),radial-gradient(800px 600px at 60% 100%,rgba(176,124,255,.30),transparent 60%),radial-gradient(600px 400px at 10% 80%,rgba(255,95,168,.18),transparent 60%),var(--bg);}
  .bg-fx .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(150,172,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(150,172,255,.07) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(180deg,#000 0%,transparent 55%);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 55%);}
  .bg-fx .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;animation:float 18s ease-in-out infinite;}
  .bg-fx .o1{width:420px;height:420px;background:#3550f0;top:-120px;left:20%;}
  .bg-fx .o2{width:360px;height:360px;background:#22e1ff;top:40%;right:-120px;opacity:.25;animation-direction:reverse;}
  @keyframes float{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,30px);}}
  @keyframes pop{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes rise{from{transform:translateY(12px);opacity:0;}to{transform:none;opacity:1;}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(34,225,255,.9),0 0 0 9px rgba(34,225,255,.25);}50%{box-shadow:0 0 0 3px rgba(34,225,255,.9),0 0 0 15px rgba(34,225,255,0);}}
  @media (prefers-reduced-motion:reduce){.bg-fx .orb{animation:none;}*{animation-duration:.01ms !important;transition:none !important;}}

  .wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:0 24px 64px;}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{width:42px;height:42px;border-radius:12px;box-shadow:0 0 0 1px var(--line-strong),0 0 28px rgba(91,124,255,.6);}
  .brand .name{font-family:var(--font-head);font-weight:700;letter-spacing:.14em;font-size:16px;}
  .brand .name span{color:var(--cyan);}
  .brand .tag{font-family:var(--font-mono);font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;}
  .top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pillbtn{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;padding:7px 12px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(20,29,77,.8);color:var(--dim);display:flex;align-items:center;gap:8px;white-space:nowrap;transition:.2s;text-decoration:none;}
  button.pillbtn:hover,a.pillbtn:hover{color:#fff;border-color:var(--cyan);}
  .sync{cursor:default;}
  .sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block;}
  .sync.ok i{background:var(--green);box-shadow:0 0 10px var(--green);}
  .sync.saving i{background:var(--amber);box-shadow:0 0 10px var(--amber);}
  .sync.error i{background:var(--red);box-shadow:0 0 10px var(--red);}

  .eyebrow{font-family:var(--font-mono);font-size:12.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .eyebrow::before{content:"";width:28px;height:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan);}
  .grad{background:linear-gradient(95deg,#fff 0%,#fff 35%,var(--cyan) 70%,var(--violet) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}

  .btn{font-family:var(--font-head);font-size:15px;font-weight:600;color:#fff;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:12px;padding:12px 18px;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  .btn:hover{border-color:var(--cyan);}
  .btn.primary{background:linear-gradient(135deg,var(--blue),var(--blue-2));border-color:transparent;}
  .btn.primary:hover{box-shadow:0 0 22px rgba(91,124,255,.6);}
  .btn.primary[disabled]{opacity:.45;box-shadow:none;cursor:not-allowed;}
  .btn.ghost{background:transparent;}
  .btn.sm{font-size:13px;padding:8px 12px;border-radius:10px;}
  .btn.danger{color:var(--red);border-color:rgba(255,107,122,.5);background:transparent;}
  .btn[disabled]{opacity:.4;cursor:default;}
  .inp{width:100%;font-size:16px;color:#fff;background:rgba(10,15,46,.55);border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;outline:none;}
  .inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,225,255,.15);}
  textarea.inp{min-height:96px;resize:vertical;}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;z-index:200;background:var(--surface-3);border:1px solid var(--line-strong);padding:11px 18px;border-radius:12px;font-size:14px;transition:.3s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* =========================================================
     ENCUESTA
     ========================================================= */
  .sv{max-width:760px;margin:0 auto;padding:4px 0 40px;}
  .sv-card{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line-strong);border-radius:26px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .sv-card.anim{animation:rise .35s ease;}
  .sv-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .prog{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 12px var(--cyan);transition:width .35s ease;}
  .stepl{font-family:var(--font-mono);font-size:11.5px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;}
  .stn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);background:rgba(34,225,255,.1);border:1px solid rgba(34,225,255,.35);padding:5px 11px;border-radius:999px;margin-bottom:12px;}
  h2.q{font-family:var(--font-head);font-size:clamp(22px,3.3vw,29px);line-height:1.18;letter-spacing:-.01em;margin:0 0 8px;}
  .qs{color:var(--dim);margin:0 0 18px;font-size:15px;}
  .q2{font-family:var(--font-head);font-weight:600;font-size:18px;margin:24px 0 12px;}
  .q2 span,.fields label span{color:var(--faint);font-weight:400;font-size:13px;font-family:var(--font-body);}
  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .opts.list{grid-template-columns:1fr 1fr;}
  .opt{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:15px 16px;border-radius:16px;background:rgba(10,15,46,.45);border:1px solid var(--line-strong);color:#fff;text-align:left;font-size:15px;font-weight:600;line-height:1.3;transition:.15s;min-height:58px;}
  .opt:hover{border-color:rgba(34,225,255,.7);}
  .opt .em{font-size:28px;line-height:1;}
  .opt.on{border-color:var(--cyan);background:rgba(34,225,255,.12);box-shadow:0 0 0 1px var(--cyan),0 0 24px rgba(34,225,255,.22);}
  .opt.on::after{content:"✓";position:absolute;top:50%;margin-top:-11px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--cyan);color:#0a0f2e;font-size:13px;font-weight:800;display:grid;place-items:center;}
  .opts:not(.list) .opt.on::after{top:10px;margin-top:0;}
  .opts.list .opt{flex-direction:row;align-items:center;padding-right:44px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:11px 16px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(10,15,46,.45);color:var(--dim);font-weight:600;font-size:14.5px;transition:.15s;}
  .chip:hover{border-color:rgba(34,225,255,.7);color:#fff;}
  .chip.on{background:var(--cyan);border-color:var(--cyan);color:#0a0f2e;}

  .nps-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--faint);margin-top:8px;}
  .navb{display:flex;gap:10px;margin-top:26px;align-items:center;}

  .welcome{text-align:center;padding:12px 4px;}
  .welcome h1{font-family:var(--font-head);font-weight:700;font-size:clamp(36px,6vw,58px);line-height:1.02;letter-spacing:-.03em;margin:0 0 14px;}
  .welcome p{color:var(--dim);font-size:17px;max-width:520px;margin:0 auto 22px;}
  .welcome .ticks{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:26px;}
  .welcome .ticks span{font-family:var(--font-mono);font-size:12px;color:var(--dim);border:1px solid var(--line-strong);border-radius:999px;padding:7px 12px;background:rgba(10,15,46,.4);}
  .welcome .btn.primary{padding:16px 34px;font-size:17px;}
  .welcome .big-em{font-size:64px;margin-bottom:8px;}
  .hint{text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--cyan);margin-top:14px;letter-spacing:.04em;min-height:18px;}
  .row-c{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;}

  .fs-ready p{color:var(--dim);max-width:420px;margin:0 auto 18px;}
  .fs-count{position:absolute;top:14px;right:14px;z-index:6;width:54px;height:54px;border-radius:50%;background:rgba(10,15,46,.9);color:#fff;font-family:var(--font-head);font-weight:700;font-size:26px;display:grid;place-items:center;box-shadow:0 0 0 3px var(--cyan);}

  /* ---------- visuales (pantallas de Tokin) ---------- */
  .vz{position:relative;margin:6px auto 0;width:100%;}

  .crop{position:relative;width:100%;overflow:hidden;}
  .crop img{position:absolute;left:0;width:100%;height:auto;pointer-events:none;user-select:none;}
  .mkw{line-height:1.3;}
  .hl{position:absolute;border-radius:10px;pointer-events:none;z-index:3;animation:pulse 1.6s ease-in-out infinite;}
  .zone{position:absolute;border:2px dashed #1E9E61;background:rgba(46,230,166,.18);border-radius:6px;pointer-events:none;z-index:2;}
  .tapdot{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(34,225,255,.55);box-shadow:0 0 0 3px #fff,0 0 22px var(--cyan);pointer-events:none;animation:pop .25s ease;z-index:4;}
  .tapdot.cf{background:rgba(255,107,122,.6);box-shadow:0 0 0 3px #fff,0 0 22px var(--red);display:grid;place-items:center;color:#fff;font:700 15px/1 var(--font-head);}
  .hdot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;opacity:.6;box-shadow:0 0 0 2px rgba(255,255,255,.85);pointer-events:none;z-index:4;}
  .hdot.ok{background:#1E9E61;}.hdot.bad{background:#D9483B;}.hdot.att{background:#22b8e0;}.hdot.cf{background:#ff4d6a;}
  .okz{outline:2.5px dashed #1E9E61 !important;outline-offset:2px;background-color:rgba(46,230,166,.12);}
  .ab{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .abo{position:relative;border-radius:18px;border:2px solid var(--line-strong);background:rgba(10,15,46,.45);padding:10px 10px 12px;text-align:center;color:#fff;font-family:var(--font-head);font-weight:700;font-size:15px;transition:.15s;line-height:1.3;}

  .abo .vzi{box-shadow:0 0 0 3px #050817;border-radius:12px;}
  .abo small{display:block;font-family:var(--font-body);font-weight:500;color:var(--faint);font-size:12px;}
  .abo.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 24px rgba(34,225,255,.3);}

  /* =========================================================
     PANEL (modo editor)
     ========================================================= */
  .hero{padding:24px 0 22px;display:grid;grid-template-columns:1fr auto;gap:40px;align-items:end;}
  .hero h1{font-family:var(--font-head);font-weight:700;font-size:clamp(38px,5.5vw,68px);line-height:1;letter-spacing:-.03em;margin:0 0 14px;}
  .hero p{color:var(--dim);font-size:16px;max-width:620px;margin:0;}

  .count{position:relative;padding:18px 22px;border-radius:18px;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line-strong);overflow:hidden;min-width:140px;box-shadow:0 10px 30px rgba(0,0,0,.25);}
  .count::after{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:var(--c,linear-gradient(90deg,var(--blue),var(--cyan)));}
  .count .v{font-family:var(--font-head);font-size:42px;font-weight:700;line-height:1;}

  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:rgba(20,29,77,.7);border:1px solid var(--line);margin-bottom:18px;backdrop-filter:blur(8px);}

  .pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
  .pc{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line-strong);border-radius:20px;padding:22px;min-width:0;}

  .ins b{color:#fff;}
  .bars{display:flex;flex-direction:column;gap:12px;}
  .br .lb{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--dim);}

  .stk{display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.08);margin:8px 0 6px;}

  .kick2{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px;}
  .health{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
  .hc{position:relative;border-radius:18px;padding:18px;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line-strong);overflow:hidden;cursor:pointer;transition:.2s;}
  .hc:hover{border-color:var(--cyan);transform:translateY(-2px);}
  .hc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--hc);box-shadow:0 0 16px var(--hc);}
  .hc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .hc h4{font-family:var(--font-head);font-size:18px;margin:0;}
  .hc .sc{font-family:var(--font-head);font-size:34px;font-weight:700;line-height:1;color:var(--hc);}
  .hc .st{display:inline-block;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#0a0f2e;background:var(--hc);padding:2px 8px;border-radius:999px;margin-top:6px;}
  .hc .q{color:var(--faint);font-size:12.5px;margin:4px 0 12px;}
  .hc .ms{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;}
  .hc .m{display:grid;grid-template-columns:1fr 70px 38px;gap:8px;align-items:center;font-size:12.5px;color:var(--dim);}
  .hc .m .t{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;}
  .hc .m .t i{display:block;height:100%;background:var(--mc);}
  .hc .m b{font-family:var(--font-mono);font-size:11.5px;color:#fff;text-align:right;}
  .hc .fd{font-size:13px;color:#fff;border-top:1px solid var(--line);padding-top:10px;}
  .hc .fd small{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:3px;}
  .hc .n{font-family:var(--font-mono);font-size:11px;color:var(--faint);}
  .quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
  .quote{background:rgba(10,15,46,.45);border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:12px;padding:12px 14px;}
  .quote p{margin:0 0 6px;color:#fff;}
  .quote small{font-family:var(--font-mono);font-size:11px;color:var(--faint);letter-spacing:.04em;}
  .words{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .words span{padding:6px 12px;border-radius:999px;background:rgba(34,225,255,.12);border:1px solid rgba(34,225,255,.4);color:#fff;font-weight:600;font-size:13px;}
  .words span b{font-family:var(--font-mono);color:var(--cyan);margin-left:6px;font-size:11.5px;}
  .abres{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}

  .abres .lbl{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-weight:600;}
  .abres .lbl b{font-family:var(--font-head);font-size:24px;}
  .abres>div.win .lbl b{color:var(--green);}
  .resp{width:100%;border-collapse:collapse;font-size:13.5px;}
  .resp th{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line-strong);font-weight:600;}
  .resp td{padding:10px 8px;border-bottom:1px solid var(--line);color:var(--dim);vertical-align:top;}
  .resp td:first-child{color:#fff;font-weight:600;}
  .tscroll{overflow-x:auto;}
  .empty-state{text-align:center;padding:56px 20px;color:var(--dim);}
  .empty-state b{color:#fff;display:block;font-family:var(--font-head);font-size:20px;margin-bottom:6px;}
  .login{max-width:420px;margin:40px auto;}
  .login h2{font-family:var(--font-head);font-size:28px;margin:6px 0 6px;}
  .login p{color:var(--dim);margin:0 0 18px;}
  .err{color:var(--red);font-size:13.5px;min-height:20px;margin-top:8px;}
  .cfgrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:12px;}
  .cfgrow .lab{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);}
  .stchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .stchip{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(10,15,46,.45);color:#fff;font-weight:600;font-size:13.5px;}
  .stchip i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);}
  .stchip.off{color:var(--faint);}
  .stchip.off i{background:var(--faint);box-shadow:none;}
  .stchip small{font-family:var(--font-mono);font-size:11px;color:var(--faint);font-weight:500;}
  .dur{font-family:var(--font-mono);font-size:12px;color:var(--dim);}
  .dur.warn{color:var(--amber);}
  .vtl{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .vt{display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;background:rgba(10,15,46,.45);border:1px solid var(--line);}

  .vt .tx b{display:block;color:#fff;font-weight:600;}
  .vt .tx small{color:var(--faint);font-size:12.5px;}
  .vt .ops{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .badge2{display:inline-block;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;color:#0a0f2e;background:var(--c);font-weight:600;margin-right:8px;vertical-align:2px;}
  .form2 label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:12px;}
  .drop{display:flex;align-items:center;justify-content:center;gap:12px;border:1.5px dashed var(--line-strong);border-radius:14px;padding:16px;color:var(--dim);cursor:pointer;font-size:14px;font-weight:600;text-align:center;min-height:72px;}

  @media (max-width:860px){

    .navb .btn.primary{max-width:none;}
    .welcome .navb{position:static;background:none;border:0;padding:0;backdrop-filter:none;}
    .face{padding:14px 4px;font-size:13px;}

    .ab{gap:8px;}
    .abo{padding:8px 6px 10px;font-size:13.5px;}
    .vt{flex-wrap:wrap;}
    .vt .ops{width:100%;justify-content:flex-start;}
  }
  /* ---------- focus group ---------- */
  .sv-card .ini{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .qnum{font-family:var(--font-mono);font-size:11.5px;color:var(--faint);letter-spacing:.1em;}

  .qpills button.on{color:#fff;border-color:var(--cyan);background:rgba(34,225,255,.1);box-shadow:0 0 14px rgba(34,225,255,.25);}
  .mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
  .mhead .mq{color:#fff;font-size:15px;max-width:560px;}
  .mhead .hmtools{margin:0;}
  .ptop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .res-ok{color:var(--green);font-weight:700;}
  .res-bad{color:var(--red);font-weight:700;}
  .resp td.mej{min-width:150px;max-width:200px;font-size:12.5px;}
  .pcell{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:13px;min-width:150px;}
  .tg{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;}
  .tg.ok{background:rgba(46,230,166,.14);color:var(--green);}
  .tg.bad{background:rgba(255,107,122,.14);color:var(--red);}
  .pmeta{font-size:12px;color:var(--faint);line-height:1.35;}
  .ptab th{vertical-align:bottom;}
  .ptab th.pq span{display:block;white-space:nowrap;}
  .ptab th.pq em{display:block;font-style:normal;font-family:var(--font-body,inherit);text-transform:none;letter-spacing:0;font-size:11.5px;color:var(--faint);font-weight:500;margin-top:3px;white-space:nowrap;}
  .ptab td{padding:12px 10px;}
  .ptab tbody tr:hover td{background:rgba(34,225,255,.05);}
  .ptab td.pn{color:var(--faint);font-family:var(--font-mono);font-size:12px;font-weight:400;}
  .pneg b{display:block;color:#fff;white-space:nowrap;}
  .pneg span{display:block;font-size:12px;color:var(--faint);margin-top:2px;}
  .pneg i{display:inline-block;font-style:normal;font-size:11.5px;color:var(--cyan);margin-top:5px;padding:2px 8px;border-radius:999px;border:1px solid rgba(34,225,255,.3);white-space:nowrap;}
  .pper span{display:block;white-space:nowrap;}
  .ptab td.nw{white-space:nowrap;font-family:var(--font-mono);font-size:12.5px;}
  .pcount{font-family:var(--font-head);font-size:20px;font-weight:700;color:#fff;}
  .pact{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .pact .inp{width:280px;max-width:100%;padding:8px 12px;font-size:14px;margin:0;}
  .xgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
  .xcard{display:flex;flex-direction:column;}
  .xcard h3{font-size:22px;}
  .xsub{color:var(--dim);margin:2px 0 14px;font-size:14px;}
  .xlist{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:2px;}
  .xlist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .xlist li b{color:#fff;white-space:nowrap;}
  .xlist li span{color:var(--faint);text-align:right;}
  .xcard .btn.big{margin-top:auto;align-self:flex-start;}
  .optk{color:#fff;font-weight:700;}
  .rtabs button i{font-style:normal;}
  .rtabs .ts{display:none;}
  @media(max-width:820px){
    .rgrid,.mix3,.xgrid{grid-template-columns:1fr;}
    .xcard .btn.big{width:100%;}
    .xlist li{flex-direction:column;gap:2px;}
    .xlist li span{text-align:left;}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
    .rhead .xbtns,.rhead .btn.big{width:100%;}
    .rtabs{gap:4px;padding:5px;}
    .rtabs button{min-width:0;padding:11px 6px;font-size:14px;}
    .rtabs button i,.rtabs button small,.rtabs .tl{display:none;}
    .rtabs .ts{display:inline;}
    .rtabs button{font-size:13.5px;white-space:nowrap;}
    .abt .hd,.abr{grid-template-columns:24px minmax(0,1fr) 40px 56px;}
    .abt .hd span:nth-child(3),.abr .tr{display:none;}
  }
</style>

async function borrarEncuestas(sids = [], keys = []){

  const parts = path.split('/').filter(Boolean); if(!parts.length) return data;

    <p class="sub" style="color:var(--faint);margin:0 0 14px">${esc([s.tipo ? lab('tipo', s.tipo) : '', s.comoPide ? lab('comoPide', s.comoPide) : '', s.uso ? lab('uso', s.uso) : '', s.disp].filter(Boolean).join(' · '))}${isDone(s) && s.dur ? ' · duró ' + mmss(s.dur) : ''} · ${ago(s.upd)}</p>
    <div class="mini3" style="margin-bottom:14px"><div><b>${answered(s)} / ${Q.length}</b><small>Preguntas respondidas</small></div><div><b>${sc.n ? sc.ok + ' / ' + sc.n : '–'}</b><small>Aciertos al primer toque</small></div><div><b>${isDone(s) ? 'Sí' : 'No'}</b><small>Terminó</small></div></div>
    ${!isDone(s) ? `<p style="color:var(--amber);margin:0 0 12px">Dejó en: ${esc(stepLabel(s))}</p>` : ''}
    <div class="tscroll"><table class="resp"><thead><tr><th>Nº</th><th>Pregunta</th><th>Tocó / eligió</th><th>Acertó</th><th>Seguimiento</th></tr></thead><tbody>${sesAnswerRows(s)}</tbody></table></div>
    ${s.cambio ? `<div class="quote" style="margin-top:14px"><p>“${esc(s.cambio)}”</p><small>Mejora que pediría</small></div>` : ''}
    <div class="acts"><button class="btn danger" id="sesDel">${TRASH.replace('<svg', '<svg style="width:15px;height:15px;vertical-align:-2px"')} Eliminar</button><button class="btn primary" data-close>Cerrar</button></div>`);
  $('#sesDel').onclick = () => confirmarBorrado([id], [], [who(s)], renderMod);
}
async function loadPanelData(){
  try{ const [r1, r2] = await Promise.all([fetch(api('/respuestas'), { cache:'no-store' }), fetch(api('/config'), { cache:'no-store' })]);
    if(r1.ok){ const d = await jget(r1) || {}; R = Object.entries(d).map(([key, v]) => ({ key, ...v })).sort((a,b) => (b.ts||0) - (a.ts||0)); loaded = true; }
    if(r2.ok){ const c = await jget(r2) || {}; CFG = { abierta:c.abierta !== false, off:c.off || {} }; } }catch(e){}
}

/* =========================================================
   Arranque
   ========================================================= */
let refreshT = null;
let surveyDraft = null;
async function route(){
  clearInterval(refreshT); stopLive();
  const hsh = location.hash;
  if(hsh === '#equipo'){ renderLogin(); return; }
  if(hsh === '#moderador'){ if(!MOD && !EDITOR){ renderLogin(); return; } renderMod(); connectLive(); return; }
  if(hsh === '#vista'){
    if(!MOD && !EDITOR){ location.hash = '#equipo'; return; }
    if(!surveyDraft) surveyDraft = { A, idx }; A = {}; idx = -1; lastRendered = null;
    try{ const r = await fetch(api('/config'), { cache:'no-store' }); if(r.ok){ const c = await jget(r) || {}; SCFG = { off:c.off || {} }; } }catch(e){}
    renderSurvey(); window.scrollTo(0,0); return;
  }
  if(surveyDraft){ A = surveyDraft.A; idx = surveyDraft.idx; surveyDraft = null; lastRendered = null; }
  if(hsh === '#panel'){
    if(!EDITOR){ renderLogin(); return; }
    renderPanel(); loadData();
    refreshT = setInterval(() => { if(!document.hidden && !$('#modalBg').classList.contains('open')) loadData(); }, 20000);
    return;
  }
  renderSurvey();
  try{
    const r = await fetch(api('/config'), { cache:'no-store' });
    if(r.ok){ const c = await jget(r) || {}; closed = c.abierta === false; SCFG = { off:c.off || {} }; }
    if(!isPanel() && (idx === -1 || closed)) rerenderKeepScroll();
  }catch(e){}
}
window.addEventListener('hashchange', route);
route();
</script>
