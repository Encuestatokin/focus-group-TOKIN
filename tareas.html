<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b26">
<title>Tokin · Probá la app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b26;--surface:#121a48;--surface-2:#19245e;--line:rgba(150,172,255,.22);--line-strong:rgba(150,172,255,.42);
    --text:#fff;--dim:#c9d2f5;--faint:#8f9bcc;--blue:#5b7cff;--blue-2:#3550f0;--cyan:#22e1ff;--green:#2ee6a6;--red:#ff5c6c;--amber:#ffc046;--violet:#b07cff;
    --fh:"Space Grotesk","Segoe UI",sans-serif;--fb:"Inter","Segoe UI",Arial,sans-serif;--fm:"JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{min-height:100vh;background:radial-gradient(800px 500px at 90% -10%,rgba(53,80,240,.45),transparent 60%),radial-gradient(600px 400px at -10% 110%,rgba(176,124,255,.18),transparent 60%),var(--bg);color:var(--text);font-family:var(--fb);font-size:16px;}
  button,input,select,textarea{font:inherit;color:inherit;}
  .wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom));}
  .wrap.wide{max-width:1180px;}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{height:28px;}
  .brand small{display:block;font-family:var(--fm);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);}
  .card{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line-strong);border-radius:20px;padding:20px;margin-bottom:14px;}
  .eyebrow{font-family:var(--fm);font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);}
  h1{font-family:var(--fh);font-size:27px;line-height:1.15;margin:8px 0 8px;}
  h2{font-family:var(--fh);font-size:21px;line-height:1.2;margin:6px 0 8px;}
  .sub{color:var(--dim);font-size:15px;line-height:1.5;}
  label.f{display:block;margin-top:14px;font-size:13px;font-weight:600;color:var(--dim);}
  label.f b{color:var(--red);}
  .inp{width:100%;margin-top:6px;padding:13px 14px;border-radius:12px;border:1px solid var(--line-strong);background:rgba(5,8,30,.55);font-size:16px;outline:none;}
  .inp:focus{border-color:var(--cyan);}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;}
  .seg button{padding:12px 6px;border-radius:12px;border:1px solid var(--line-strong);background:rgba(5,8,30,.4);cursor:pointer;font-size:14.5px;}
  .seg button.on{border-color:var(--cyan);background:rgba(34,225,255,.14);font-weight:600;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:14px;border:1px solid var(--line-strong);background:rgba(255,255,255,.04);cursor:pointer;font-weight:600;font-size:15.5px;text-decoration:none;color:#fff;}
  .btn.primary{background:linear-gradient(135deg,var(--blue),var(--blue-2));border-color:transparent;box-shadow:0 8px 24px rgba(91,124,255,.45);}
  .btn.primary:disabled{opacity:.45;box-shadow:none;cursor:not-allowed;}
  .btn.sm{padding:9px 14px;font-size:14px;}
  .full{width:100%;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  /* prototipo */
  .task{position:sticky;top:0;z-index:15;margin:0 -16px 12px;padding:10px 16px;background:rgba(7,11,38,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .task .tl{font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);}
  .task p{font-size:15px;line-height:1.35;margin-top:3px;}
  .phone{position:relative;max-width:430px;margin:0 auto;border-radius:26px;overflow:hidden;border:6px solid #0b1238;box-shadow:0 0 0 1px rgba(140,170,255,.35),0 20px 50px rgba(0,0,0,.5);background:#fff;}
  .phone img{display:block;width:100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none;}
  .phone .hit{position:absolute;inset:0;cursor:pointer;}
  .ripple{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(34,225,255,.35);border:2px solid rgba(34,225,255,.9);pointer-events:none;animation:rip .55s ease-out forwards;}
  @keyframes rip{from{transform:scale(.4);opacity:1;}to{transform:scale(1.6);opacity:0;}}
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(7,11,38,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);}
  .bar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;}
  .bar .btn{flex:1;}
  .bar small{color:var(--faint);font-size:12.5px;}
  .ok-ov{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(3,5,20,.75);padding:20px;}
  .ok-ov .card{max-width:440px;width:100%;text-align:center;}
  .big{font-size:52px;line-height:1;}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px;}
  .scale button{padding:14px 0;border-radius:12px;border:1px solid var(--line-strong);background:rgba(5,8,30,.4);font-weight:700;font-size:18px;cursor:pointer;}
  .scale button.on{border-color:var(--cyan);background:rgba(34,225,255,.16);}
  .scale-l{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:6px;}
  .pvbar{max-width:430px;margin:0 auto 10px;padding:8px 12px;border-radius:12px;background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.4);color:#FFD23F;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
  .pvbar b{font-weight:800;} .pvbar .acts{display:flex;gap:6px;flex-wrap:wrap;}
  .pvbar button{font:inherit;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,210,63,.5);background:transparent;color:#FFD23F;cursor:pointer;}
  .pvbar button.on{background:#FFD23F;color:#14217A;}
  .zv{position:absolute;z-index:2;border:2px dashed rgba(34,225,255,.9);background:rgba(34,225,255,.10);border-radius:8px;pointer-events:none;}
  .zv.ok{border:2px solid #2BE38A;background:rgba(43,227,138,.18);} .zv.nav{border-color:#B47CFF;background:rgba(180,124,255,.14);}
  .zv em{position:absolute;left:2px;top:2px;font-style:normal;font-size:9px;line-height:1.1;font-weight:700;background:rgba(10,14,40,.85);color:#fff;padding:1px 4px;border-radius:4px;max-width:96%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .pvlist{display:grid;gap:10px;margin-top:14px;} .pvt{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px;border-radius:14px;border:1px solid var(--line,rgba(255,255,255,.14));background:rgba(255,255,255,.04);}
  .pvt b{display:block;font-size:16px;} .pvt span{font-size:13px;opacity:.75;}
  .hint{position:absolute;z-index:3;border:3px solid var(--amber);border-radius:12px;box-shadow:0 0 0 9999px rgba(3,5,20,.38),0 0 22px var(--amber);pointer-events:none;animation:hp 1.3s ease-in-out infinite;}
  .hint + .hint{box-shadow:0 0 22px var(--amber);}
  @keyframes hp{50%{transform:scale(1.06);}}
  .hintmsg{max-width:430px;margin:0 auto 10px;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,192,70,.5);background:rgba(255,192,70,.12);color:#ffe2a3;font-size:14.5px;line-height:1.4;}
  .tg.mid{background:rgba(255,192,70,.14);color:var(--amber);}
  .stack{display:flex;height:30px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.06);}
  .stack i{display:block;height:100%;}
  .stl{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--dim);}
  .stl span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px;}
  .map canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;padding:12px 18px;border-radius:12px;background:#0d1440;border:1px solid var(--line-strong);font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;}
  .toast.on{opacity:1;}
  /* panel */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px;}
  .kpi{padding:14px;border-radius:14px;border:1px solid var(--line-strong);background:linear-gradient(160deg,var(--surface-2),var(--surface));}
  .kpi b{display:block;font-family:var(--fh);font-size:30px;line-height:1;}
  .kpi small{display:block;font-size:12px;color:var(--faint);margin-top:7px;line-height:1.3;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .bars{display:flex;flex-direction:column;gap:10px;}
  .br .lb{display:flex;justify-content:space-between;gap:10px;font-size:14px;}
  .br .lb b{font-family:var(--fm);font-size:12.5px;color:var(--dim);white-space:nowrap;}
  .br .bt{height:9px;border-radius:5px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden;}
  .br .bt i{display:block;height:100%;border-radius:5px;background:var(--c,var(--cyan));}
  .funnel{display:flex;flex-direction:column;gap:8px;}
  .fs{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:14px;}
  .fs .bt{height:26px;border-radius:7px;background:rgba(255,255,255,.06);overflow:hidden;}
  .fs .bt i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));}
  .fs b{font-family:var(--fm);text-align:right;}
  .seg2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .seg2 button{padding:9px 14px;border-radius:10px;border:1px solid var(--line-strong);background:rgba(5,8,30,.4);cursor:pointer;font-size:14px;}
  .seg2 button.on{border-color:var(--cyan);background:rgba(34,225,255,.14);font-weight:600;}
  .map{position:relative;max-width:360px;margin:0 auto;border-radius:16px;overflow:hidden;border:1px solid var(--line-strong);}
  .map img{display:block;width:100%;filter:brightness(.72);}
  .dot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid #fff;opacity:.85;}
  .dot.nav{background:var(--green);} .dot.miss{background:var(--red);}
  .legend{display:flex;gap:14px;justify-content:center;font-size:12.5px;color:var(--dim);margin-top:10px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  .tg{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;}
  .tg.ok{background:rgba(46,230,166,.14);color:var(--green);} .tg.bad{background:rgba(255,107,122,.14);color:var(--red);}
  .tscroll{overflow-x:auto;}
  .trash{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--faint);}
  .path{font-size:12px;color:var(--faint);}
  .empty{color:var(--faint);font-size:14px;}
  @media(max-width:760px){ .grid2{grid-template-columns:1fr;} .fs{grid-template-columns:110px 1fr 60px;} }
</style>
</head>

    <div class="kpis"><div class="kpi"><b>${n}</b><small>Participantes</small></div>
      <div class="kpi"><b style="color:var(--green)">${pct(cnt('solo'), n)}</b><small>Lo encontraron solos</small></div>
      <div class="kpi"><b style="color:var(--amber)">${pct(cnt('pista'), n)}</b><small>Lo encontraron con la pista</small></div>
      <div class="kpi"><b style="color:var(--red)">${pct(cnt('no'), n)}</b><small>No lo lograron</small></div>
      <div class="kpi"><b>${soloL.length ? median(soloL.map(d => d.dur)).toFixed(0) + 's' : '–'}</b><small>Tiempo mediano (los que lo hicieron solos)</small></div>
      <div class="kpi"><b>${seqs.length ? (seqs.reduce((a, b) => a + b, 0) / seqs.length).toFixed(1) : '–'}</b><small>Facilidad (1 a 5)</small></div>
      ${T.ask ? `<div class="kpi"><b style="color:var(--cyan)">${pct(okL.filter(d => d.ans === T.ask.ok).length, okL.filter(d => d.ans).length)}</b><small>${esc(T.ask.kpi)}</small></div>` : ''}</div>
    <div class="grid2">
      <div class="card"><div class="eyebrow" style="margin-bottom:14px">Hasta dónde llegaron</div><div class="funnel">
        ${(T.funnel || steps.map(s => [SCREENS[s].n, [s]])).map(([l, ss]) => `<div class="fs"><span>${esc(l)}</span><div class="bt"><i style="width:${n ? reachAny(ss) / n * 100 : 0}%"></i></div><b>${pct(reachAny(ss), n)}</b></div>`).join('')}
        <div class="fs"><span>✅ Lo lograron</span><div class="bt"><i style="width:${n ? okL.length / n * 100 : 0}%;background:var(--green)"></i></div><b>${pct(okL.length, n)}</b></div></div>
        <div class="eyebrow" style="margin:20px 0 12px">Por dónde llegaron</div>${barsH(Object.entries(ways).sort((a, b) => b[1] - a[1]).slice(0, 4), okL.length, 'var(--green)')}</div>
      <div class="card"><div class="eyebrow" style="margin-bottom:14px;color:var(--amber)">💡 Dónde necesitaron la pista</div>${barsH(Object.entries(helpAt).sort((a, b) => b[1] - a[1]), n, 'var(--amber)')}
        <div class="eyebrow" style="margin:20px 0 12px;color:var(--amber)">Por qué apareció la pista</div>${barsH(Object.entries(helpBy).sort((a, b) => b[1] - a[1]), L.filter(d => d.help).length, 'var(--amber)')}
        <div class="eyebrow" style="margin:20px 0 12px">Primer toque al empezar el paso</div>${barsH(Object.entries(firstHome).sort((a, b) => b[1] - a[1]).slice(0, 5), n, 'var(--cyan)')}</div>
    </div>
    <div class="grid2">
      <div class="card"><div class="eyebrow" style="margin-bottom:12px">🔥 Mapa de calor</div>
        <div class="seg2">${steps.map(s => `<button data-s="${s}" class="${s === SELS ? 'on' : ''}">${esc(SCREENS[s].n)}</button>`).join('')}</div>
        <div class="seg2">${[['calor','Calor'],['toques','Cada toque']].map(m => `<button data-hm="${m[0]}" class="${HM === m[0] ? 'on' : ''}">${m[1]}</button>`).join('')}</div>
        <div class="map"><img src="${IMGS[SCREENS[SELS].img]}" alt="">${HM === 'calor' ? '<canvas id="hcv"></canvas>' : taps.slice(0, 800).map(x => `<span class="dot ${x.nav ? 'nav' : 'miss'}" style="left:${x.x * 100}%;top:${x.y * 100}%"></span>`).join('')}</div>
        <div class="legend">${HM === 'calor' ? `<span>${taps.length} toques en esta pantalla · más intenso = más toques</span>` : '<span><i style="background:var(--green)"></i>Avanzó</span><span><i style="background:var(--red)"></i>No llevaba a ningún lado</span>'}</div></div>
      <div class="card"><div class="eyebrow" style="margin-bottom:14px;color:var(--red)">Dónde lo buscaron (toques que no llevaron a ningún lado)</div>${barsH(Object.entries(misses).sort((a, b) => b[1] - a[1]).slice(0, 10), n, 'var(--red)')}
        <p class="empty" style="margin-top:10px">% de participantes que tocó cada lugar esperando encontrar la función.</p></div>
    </div>
    <div class="card"><div class="eyebrow" style="margin-bottom:12px">Participantes</div>
      ${n ? `<div class="tscroll"><table><thead><tr><th>Negocio</th><th>Usa Tokin</th><th>Resultado</th><th>Pista</th><th>Tiempo</th><th>Toques</th><th>Facilidad</th><th>Camino</th><th>Dónde lo buscaría</th><th></th></tr></thead><tbody>
      ${L.map(d => { const r = RES[resOf(d)]; return `<tr><td><b>${esc(d.negocio)}</b><br><span class="path">${esc(d.distribuidor || '')}</span></td><td>${esc((USO.find(u => u[0] === d.uso) || [, '–'])[1])}</td>
        <td><span class="tg ${r[2]}">${r[0]}</span>${d.ans ? `<br><span class="path">Dijo: ${esc(d.ans)}${T.ask ? (d.ans === T.ask.ok ? ' ✓' : ' ✗') : ''}</span>` : ''}</td>
        <td class="path">${d.help ? `En ${esc((SCREENS[d.helpScreen] || {}).n || '–')}, a los ${d.helpT}s (${esc(HINT_TXT[d.helpBy] || '')})` : '–'}</td>
        <td>${d.dur}s</td><td>${d.toques}</td><td>${d.seq || '–'}</td>
        <td class="path">${(d.path || []).map(s => esc(SCREENS[s] ? SCREENS[s].n : s)).join(' → ')}</td><td class="path">${esc(d.where || '–')}</td>
        <td><button class="trash" data-del="${esc(d.k)}" title="Eliminar">🗑</button></td></tr>`; }).join('')}</tbody></table></div>` : '<p class="empty">Todavía no hay participantes.</p>'}</div>`;
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { SELT = b.dataset.t; SELS = (TASKS.find(t => t.id === SELT).screens || [])[0]; panel(); });
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { SELS = b.dataset.s; panel(); });
  document.querySelectorAll('[data-hm]').forEach(b => b.onclick = () => { HM = b.dataset.hm; panel(); });
  const cv = $('#hcv'); if(cv){ const im = cv.previousElementSibling; const go = () => heat(cv, taps); im.complete ? go() : im.onload = go; }
  $('#bXls').onclick = exportXls;
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if(!b.dataset.c){ b.dataset.c = 1; b.textContent = '¿?'; b.style.color = 'var(--red)'; return; }
    try{ const r = await fetch(api('/tareas/' + b.dataset.del), { method:'DELETE' }); if(!r.ok) throw 0; DATA = DATA.filter(d => d.k !== b.dataset.del); toast('Eliminado'); panel(); }catch(e){ toast('No se pudo eliminar'); }
  });
}
function loadXlsx(){ return window.XLSX ? Promise.resolve() : new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function exportXls(){
  const T = n => (TASKS.find(t => t.id === n) || {}).n || n;
  const part = DATA.map(d => ({ 'Fecha':d.ts ? new Date(d.ts).toLocaleString('es-AR') : '', 'Negocio':d.negocio, 'Distribuidor':d.distribuidor, 'Usa Tokin':(USO.find(u => u[0] === d.uso) || [, ''])[1], 'Tarea':T(d.task),
    'Resultado':RES[resOf(d)][0], 'Necesitó pista':d.help ? 'Sí' : 'No', 'Pista en pantalla':d.help ? ((SCREENS[d.helpScreen] || {}).n || '') : '', 'Pista porque':d.help ? (HINT_TXT[d.helpBy] || '') : '', 'Segundo de la pista':d.help ? d.helpT : '', 'Toques antes de la pista':d.help ? d.helpTaps : '', 'Tiempo (s)':d.dur, 'Toques':d.toques, 'Facilidad (1-5)':d.seq || '', 'Respuesta comprensión':d.ans || '', 'Camino':(d.path || []).map(s => SCREENS[s] ? SCREENS[s].n : s).join(' → '), 'Dónde lo buscaría':d.where || '', 'Dispositivo':d.disp || '' }));
  const toques = []; DATA.forEach(d => (d.taps || []).forEach((x, i) => toques.push({ 'Negocio':d.negocio, 'Tarea':T(d.task), 'Orden':i + 1, 'Pantalla':SCREENS[x.s] ? SCREENS[x.s].n : x.s, 'Elemento':zl(x.s, x.a), 'Avanzó':x.nav ? 'Sí' : 'No', 'Con pista visible':x.h ? 'Sí' : 'No', 'Segundo':x.t, 'X %':Math.round(x.x * 1000) / 10, 'Y %':Math.round(x.y * 1000) / 10 })));
  try{ await loadXlsx(); const wb = XLSX.utils.book_new();
    const add = (name, rows) => { const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ 'Sin datos':'' }]); ws['!cols'] = Object.keys(rows[0] || { a:1 }).map(k => ({ wch:Math.max(12, k.length + 2) })); XLSX.utils.book_append_sheet(wb, ws, name); };
    add('Participantes', part); add('Toques', toques); XLSX.writeFile(wb, `tareas-tokin-${new Date().toISOString().slice(0, 10)}.xlsx`); }
  catch(e){ toast('No se pudo generar el Excel'); }
}

/* ---------- arranque ---------- */
function pvBar(){ return `<div class="pvbar"><span><b>👁 Vista previa</b> · nada se guarda</span><span class="acts"><button id="pvZ" class="${PVZ ? 'on' : ''}">${PVZ ? 'Ocultar zonas' : 'Ver zonas tocables'}</button>${RUN && RUN.screen ? '<button id="pvH">Ver pista</button><button id="pvR">Reiniciar</button>' : ''}<button id="pvL">Tareas</button></span></div>`; }
function bindPv(){
  const z = $('#pvZ'); if(z) z.onclick = () => { PVZ = !PVZ; z.classList.toggle('on', PVZ); z.textContent = PVZ ? 'Ocultar zonas' : 'Ver zonas tocables'; paintZones(); };
  const h = $('#pvH'); if(h) h.onclick = () => { if(RUN && RUN.screen) giveHint('boton'); };
  const r = $('#pvR'); if(r) r.onclick = () => pvRun(TI);
  const l = $('#pvL'); if(l) l.onclick = () => pvHome();
}
function paintZones(){
  document.querySelectorAll('.zv').forEach(x => x.remove());
  if(!PVZ || !RUN || !$('#ph')) return;
  const T = PT[TI], S = SCREENS[RUN.screen], ok = (T.hints || {})[RUN.screen] || [];
  S.z.forEach(z => { const d = document.createElement('div'); d.className = 'zv' + (ok.includes(z.id) ? ' ok' : z.go ? ' nav' : '');
    Object.assign(d.style, { left:(z.x * 100) + '%', top:(z.y * 100) + '%', width:(z.w * 100) + '%', height:(z.h * 100) + '%' }); d.innerHTML = `<em>${esc(z.l)}</em>`; $('#ph').appendChild(d); });
}
function pvRun(i){ TI = i; RUN = null; brief(); window.scrollTo(0, 0); }
function pvHome(){
  PV = true; PT = TASKS; RUN = null; document.querySelectorAll('.ok-ov').forEach(o => o.remove()); clearTimeout(window.__t);
  $('#wrap').classList.remove('wide'); $('#hsub').textContent = 'Tareas · Vista previa';
  $('#hright').innerHTML = `<div class="row"><a class="btn sm" href="#equipo">← Resultados</a></div>`;
  bar('');
  $('#app').innerHTML = `<div class="card"><div class="eyebrow">Equipo Tokin · Vista previa</div><h1>Recorrer las tareas</h1>
    <p class="sub">Probá cada tarea como la vería un PDV. Nada de lo que hagas acá se guarda ni aparece en los resultados.</p>
    <div class="pvlist">${TASKS.map((t, i) => `<div class="pvt"><div><b>${i + 1}. ${esc(t.n)}</b><span>${esc(t.tShort)}</span></div><button class="btn primary sm" data-pv="${i}">Recorrer</button></div>`).join('')}</div>
    <p class="sub" style="font-size:13px;margin-top:14px">Dentro de cada tarea: <b>Ver zonas tocables</b> muestra todo lo que se puede tocar en la pantalla (verde = camino correcto, violeta = lleva a otra pantalla). <b>Ver pista</b> muestra la ayuda que recibe el PDV.</p></div>`;
  document.querySelectorAll('[data-pv]').forEach(b => b.onclick = () => pvRun(+b.dataset.pv));
}
function route(){ if(location.hash === '#recorrer') return AUTH ? pvHome() : login('#recorrer');
  PV = false; if(location.hash === '#equipo') return AUTH ? loadPanel() : login(); $('#wrap').classList.remove('wide'); $('#hright').innerHTML = ''; startPDV(); }
addEventListener('hashchange', route); route(); flushQ();
</script>
</body>
</html>
