<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b26">
<title>Tokin · Guía de visita a PDV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b26;--surface:#121a48;--surface-2:#19245e;--line:rgba(150,172,255,.22);--line-strong:rgba(150,172,255,.42);
    --text:#fff;--dim:#c9d2f5;--faint:#8f9bcc;--blue:#5b7cff;--blue-2:#3550f0;--cyan:#22e1ff;--green:#2ee6a6;--red:#ff5c6c;--amber:#ffc046;--violet:#b07cff;
    --fh:"Space Grotesk","Segoe UI",sans-serif;--fb:"Inter","Segoe UI",Arial,sans-serif;--fm:"JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{min-height:100vh;background:radial-gradient(800px 500px at 90% -10%,rgba(53,80,240,.45),transparent 60%),radial-gradient(600px 400px at -10% 110%,rgba(176,124,255,.18),transparent 60%),var(--bg);color:var(--text);font-family:var(--fb);font-size:16px;}
  button,input,select,textarea{font:inherit;color:inherit;}
  .wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom));}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{height:28px;}
  .brand small{display:block;font-family:var(--fm);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:2px;}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(10,15,46,.6);font-size:13px;color:var(--dim);cursor:pointer;text-decoration:none;}
  .pill i{width:8px;height:8px;border-radius:50%;background:var(--faint);}
  .pill.ok i{background:var(--green);box-shadow:0 0 8px var(--green);}
  .pill.warn i{background:var(--amber);}
  .card{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line-strong);border-radius:20px;padding:20px;margin-bottom:14px;}
  .eyebrow{font-family:var(--fm);font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);}
  h1{font-family:var(--fh);font-size:26px;line-height:1.15;margin:8px 0 6px;}
  .sub{color:var(--dim);font-size:14.5px;line-height:1.45;}
  label.f{display:block;margin-top:14px;font-size:13px;font-weight:600;color:var(--dim);}
  label.f b{color:var(--red);}
  .inp{width:100%;margin-top:6px;padding:13px 14px;border-radius:12px;border:1px solid var(--line-strong);background:rgba(5,8,30,.55);font-size:16px;outline:none;}
  .inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,225,255,.15);}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;}
  .seg button{padding:12px 6px;border-radius:12px;border:1px solid var(--line-strong);background:rgba(5,8,30,.4);cursor:pointer;font-size:14.5px;}
  .seg button.on{border-color:var(--cyan);background:rgba(34,225,255,.14);color:#fff;font-weight:600;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:14px;border:1px solid var(--line-strong);background:rgba(255,255,255,.04);cursor:pointer;font-weight:600;font-size:15.5px;text-decoration:none;}
  a.btn{color:#fff;}
  .btn.primary{background:linear-gradient(135deg,var(--blue),var(--blue-2));border-color:transparent;box-shadow:0 8px 24px rgba(91,124,255,.45);}
  .btn.primary:disabled{opacity:.45;box-shadow:none;cursor:not-allowed;}
  .btn.danger{color:var(--red);border-color:rgba(255,92,108,.45);}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  /* pregunta */
  .prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .prog .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;}
  .prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .3s;}
  .prog span{font-family:var(--fm);font-size:12px;color:var(--faint);}
  .sec{display:inline-block;font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(34,225,255,.12);color:var(--cyan);}
  .q{font-family:var(--fh);font-weight:700;font-size:clamp(25px,6.6vw,34px);line-height:1.2;margin:14px 0 6px;}
  .tipq{font-size:13.5px;color:var(--faint);}
  .rec{display:flex;flex-direction:column;align-items:center;gap:10px;margin:22px 0 8px;}
  .mic{width:96px;height:96px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--blue-2));box-shadow:0 10px 30px rgba(91,124,255,.55);transition:transform .15s;}
  .mic:active{transform:scale(.96);}
  .mic svg{width:40px;height:40px;}
  .mic.on{background:linear-gradient(135deg,#ff6b7a,#e0283c);box-shadow:0 0 0 0 rgba(255,92,108,.6);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,92,108,.55);}70%{box-shadow:0 0 0 22px rgba(255,92,108,0);}100%{box-shadow:0 0 0 0 rgba(255,92,108,0);}}
  .recst{font-size:14px;color:var(--dim);min-height:20px;text-align:center;}
  .recst.on{color:#ff9aa5;font-weight:600;}
  .tr{width:100%;min-height:150px;margin-top:6px;padding:14px;border-radius:14px;border:1px solid var(--line-strong);background:rgba(5,8,30,.55);font-size:16.5px;line-height:1.5;resize:vertical;outline:none;}
  .tr:focus{border-color:var(--cyan);}
  .interim{font-size:15px;color:var(--faint);font-style:italic;min-height:20px;margin-top:8px;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .tag{font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid rgba(46,230,166,.45);background:rgba(46,230,166,.1);color:var(--green);}
  .tag.neg{border-color:rgba(255,92,108,.45);background:rgba(255,92,108,.1);color:#ff9aa5;}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(7,11,38,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);}
  .nav .in{max-width:720px;margin:0 auto;display:flex;gap:10px;}
  .nav .btn{flex:1;}
  .nav .btn.back{flex:0 0 auto;}
  .note{font-size:13px;color:var(--faint);line-height:1.45;margin-top:10px;}
  .warnbox{padding:12px 14px;border-radius:12px;border:1px solid rgba(255,192,70,.45);background:rgba(255,192,70,.08);color:#ffd98a;font-size:13.5px;line-height:1.45;margin-top:12px;}
  .sum h3{font-family:var(--fh);font-size:17px;margin:16px 0 6px;color:var(--cyan);}
  .sum p{font-size:15px;line-height:1.5;color:var(--dim);white-space:pre-wrap;}
  .sum .qq{font-size:13px;color:var(--faint);margin-top:10px;}
  .list{display:flex;flex-direction:column;gap:10px;}
  .vis{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);}
  .vis b{display:block;}
  .vis small{display:block;color:var(--faint);font-size:12.5px;margin-top:3px;}
  .trash{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--faint);display:grid;place-items:center;}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:50;padding:12px 18px;border-radius:12px;background:#0d1440;border:1px solid var(--line-strong);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;}
  .toast.on{opacity:1;}
  .center{text-align:center;}
  .follow{margin-top:14px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,192,70,.45);background:rgba(255,192,70,.08);}
  .follow .h{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;}
  .follow p{font-size:16px;line-height:1.4;color:#fff;margin-top:6px;}
  .follow p::before{content:"💬 ";}
  .qtools{display:flex;gap:8px;margin-top:10px;}
  .qtools .btn{flex:1;padding:12px 10px;font-size:14.5px;}
  .star.on{border-color:var(--amber);color:var(--amber);}
  .cita{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,192,70,.35);background:rgba(255,192,70,.06);margin-top:8px;font-size:15px;line-height:1.45;}
  .cita span{flex:1;}
  .cita q{quotes:"“" "”";}
  .cita q::before,.cita q::after{color:var(--amber);font-weight:700;}
  .cita small{display:block;color:var(--faint);font-size:12px;margin-top:3px;}
  .cita button{border:0;background:transparent;color:var(--faint);font-size:18px;cursor:pointer;padding:0 4px;}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:14px;background:rgba(5,8,30,.55);border:1px solid var(--line);margin-bottom:14px;}
  .tabs button{padding:11px;border-radius:10px;border:0;background:transparent;color:var(--dim);font-weight:600;cursor:pointer;}
  .tabs button.on{background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff;}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .kpi{padding:12px;border-radius:14px;border:1px solid var(--line-strong);background:linear-gradient(160deg,var(--surface-2),var(--surface));}
  .kpi b{display:block;font-family:var(--fh);font-size:26px;line-height:1;}
  .kpi small{display:block;font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.3;}
  .bars{display:flex;flex-direction:column;gap:10px;}
  .br .lb{display:flex;justify-content:space-between;gap:10px;font-size:14px;}
  .br .lb b{font-family:var(--fm);font-size:12.5px;color:var(--dim);white-space:nowrap;}
  .br .bt{height:8px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden;}
  .br .bt i{display:block;height:100%;border-radius:4px;background:var(--c,var(--cyan));}
  .empty{color:var(--faint);font-size:14px;}
</style>
</head>

const qsFor = uso => QS.filter(q => q.for === 'all' || (uso === 'si' ? q.for === 'si' : q.for === 'no'));

/* ---------- temas detectados (lectura automática de lo que dijo) ---------- */
const TEMAS = [
  ['Precios', /precio|caro|barat|cuesta|sale\b|cotiz/i], ['Promos', /promo|oferta|descuento|2x1|3x2/i],
  ['Pedido fácil', /pedido f[aá]cil/i], ['Repetir pedido', /repetir/i], ['Vendedor / preventista', /vendedor|preventista|corredor/i],
  ['WhatsApp / teléfono', /whats|wsp|wpp|tel[eé]fono|llam/i], ['Entrega / logística', /entreg|lleg|demor|tard|reparto|cami[oó]n/i],
  ['Pagos / crédito', /\bpag(o|ar|u[eé]|a\b)|transfer|cr[eé]dito|efectivo|mercado ?pago|cuenta corriente/i], ['Faltantes / stock', /falt|stock|no hay|sin stock/i],
  ['Facilidad de uso', /f[aá]cil|r[aá]pido|c[oó]modo|pr[aá]ctic/i]
];
const NEG = [['Problemas con la app', /no anda|se cuelga|error|lent[ao]|complicad|dif[ií]cil|no entiendo|no me sale|no funciona/i], ['No conoce Tokin', /no (la )?conozco|nunca (la )?(us|escuch)/i]];
/* ---------- repreguntas sugeridas según lo que dice el PDV ---------- */
const FOLLOW = [
  [/tard|demor|lleg/i, '¿Cuánto tarda? ¿Qué hacés mientras esperás el pedido?'],
  [/vendedor|preventista|corredor/i, '¿Qué te resuelve el vendedor que la app no?'],
  [/whats|wsp|wpp|tel[eé]fono|llam/i, '¿Qué te sirve de pedir por WhatsApp? ¿Qué cambiarías?'],
  [/precio|caro|barat/i, '¿Con qué comparás los precios? ¿Dónde los consultás hoy?'],
  [/promo|oferta|descuento/i, '¿Qué promo te sirvió de verdad la última vez? ¿Por qué?'],
  [/pedido f[aá]cil|repetir/i, '¿Qué esperabas que hiciera? ¿Qué pasó cuando lo tocaste?'],
  [/no anda|se cuelga|error|lent[ao]|no funciona|no me sale/i, '¿En qué momento te pasó? ¿Qué hiciste después?'],
  [/complicad|dif[ií]cil|no entiendo|confus/i, '¿Qué parte te costó? ¿Me mostrás dónde?'],
  [/f[aá]cil|r[aá]pido|c[oó]modo|pr[aá]ctic/i, '¿Qué es lo que más te gusta de eso? ¿Lo usás seguido?'],
  [/falt|stock|no hay/i, '¿Qué productos te faltan más seguido? ¿Qué hacés cuando pasa?'],
  [/pag|transfer|cr[eé]dito|efectivo|cuenta corriente/i, '¿Cómo preferís pagar? ¿Por qué?'],
  [/no (la )?conozco|nunca (la )?(us|escuch)/i, '¿Cómo te enterás hoy de las novedades? ¿Quién te lo contaría?'],
  [/celular|tel[eé]fono viejo|internet|se[nñ]al/i, '¿Con qué celular pedís? ¿Tenés buena señal en el local?']
];
const followFor = txt => { if(!txt || txt.trim().length < 8) return []; const hits = FOLLOW.filter(([r]) => r.test(txt)).map(([, f]) => f); return hits.slice(-2); };
const lastSentence = txt => { const parts = String(txt || '').split(/(?<=[.?!])\s+/).map(x => x.trim()).filter(Boolean); return parts[parts.length - 1] || ''; };
const temas = txt => ({ pos: TEMAS.filter(([, r]) => r.test(txt)).map(([n]) => n), neg: NEG.filter(([, r]) => r.test(txt)).map(([n]) => n) });

/* ---------- estado ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const DRAFT_KEY = 'tokinVisitaDraft', QUEUE_KEY = 'tokinVisitaQueue';
const ls = { get:(k, d) => { try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } }, set:(k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
let AUTH = false, V = null, STEP = 0, VIS = {};
const newVisit = () => ({ id:'v' + Date.now().toString(36), start:Date.now(), negocio:'', direccion:'', distribuidor:'', visitante:ls.get('tokinVisitante', ''), uso:'', a:{}, encuesta:'', citas:[] });
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2600); }
const save = () => { if(V) ls.set(DRAFT_KEY, { V, STEP }); };

/* ---------- dictado ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recOn = false, recQ = null;
function startRec(qid){
  if(!SR) return toast('Este navegador no permite dictado. Usá el micrófono del teclado.');
  stopRec(); recQ = qid; recOn = true;
  rec = new SR(); rec.lang = 'es-AR'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i], txt = r[0].transcript.trim();
      if(r.isFinal && txt){ const cur = V.a[recQ] || ''; V.a[recQ] = (cur ? cur.replace(/\s+$/, '') + ' ' : '') + txt.charAt(0).toUpperCase() + txt.slice(1) + (/[.?!]$/.test(txt) ? '' : '.'); const ta = $('#ta'); if(ta){ ta.value = V.a[recQ]; ta.scrollTop = ta.scrollHeight; } paintTags(); save(); }
      else interim += txt + ' ';
    }
    const im = $('#interim'); if(im) im.textContent = interim;
  };
  rec.onerror = e => { if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){ recOn = false; toast('Permití el uso del micrófono para grabar.'); paintRec(); } };
  rec.onend = () => { if(recOn){ try{ rec.start(); }catch(e){} } else paintRec(); };
  try{ rec.start(); }catch(e){}
  paintRec();
}
function stopRec(){ recOn = false; if(rec){ try{ rec.stop(); }catch(e){} rec = null; } const im = $('#interim'); if(im) im.textContent = ''; paintRec(); }
function paintRec(){
  const b = $('#mic'), s = $('#recst'); if(!b) return;
  b.classList.toggle('on', recOn);
  s.classList.toggle('on', recOn);
  s.textContent = recOn ? '● Grabando… tocá para pausar' : (SR ? 'Tocá para grabar la respuesta' : 'Dictado no disponible: escribí o usá el micrófono del teclado');
}
function paintFollow(){ const el = $('#follow'); if(!el || !recQ && !el.dataset.q) return; const q = el.dataset.q; const f = followFor(V.a[q]);
  el.hidden = !f.length; el.innerHTML = f.length ? `<div class="h">Repreguntá</div>${f.map(x => `<p>${esc(x)}</p>`).join('')}` : ''; }
function paintStar(){ const b = $('#bStar'); if(!b) return; const q = b.dataset.q; const n = (V.citas || []).filter(c => c.q === q).length; b.classList.toggle('on', n > 0); b.textContent = n ? `⭐ ${n} ${n === 1 ? 'cita guardada' : 'citas guardadas'}` : '⭐ Guardar como cita'; }
function addCita(q){
  const ta = $('#ta'); let t = '';
  if(ta && ta.selectionEnd > ta.selectionStart) t = ta.value.slice(ta.selectionStart, ta.selectionEnd).trim();
  if(!t) t = lastSentence(V.a[q]);
  if(!t) return toast('Todavía no hay texto para guardar como cita');
  V.citas = V.citas || []; if(V.citas.some(c => c.t === t && c.q === q)) return toast('Esa frase ya está guardada');
  V.citas.push({ q, t:t.replace(/^["“]|["”]$/g, '') }); save(); paintStar(); toast('⭐ Cita guardada: "' + (t.length > 60 ? t.slice(0, 60) + '…' : t) + '"');
}
function paintTags(){ paintFollow(); const el = $('#tags'); if(!el) return; const t = temas(Object.values(V.a).join(' ')); el.innerHTML = [...t.pos.map(x => `<span class="tag">${esc(x)}</span>`), ...t.neg.map(x => `<span class="tag neg">${esc(x)}</span>`)].join(''); }

/* ---------- pantallas ---------- */
const nav = html => { const n = $('#nav'); n.hidden = !html; $('#navIn').innerHTML = html || ''; };
function render(){
  stopRec();
  if(!AUTH) return renderLogin();
  if(!V) return renderHome();
  const Qs = qsFor(V.uso);
  if(STEP === 0) return renderFicha();
  if(STEP <= Qs.length) return renderQ(Qs[STEP - 1], STEP, Qs.length);
  return renderFin();
}
function renderLogin(){
  nav('');
  $('#app').innerHTML = `<div class="card"><div class="eyebrow">Equipo Tokin</div><h1>Guía de visita a PDV</h1><p class="sub">Leés cada pregunta, grabás la respuesta del kiosquero y queda escrita sola.</p>
    <form id="pf"><label class="f">Contraseña del equipo</label><input class="inp" name="pin" type="password" autocomplete="current-password" required>
    <div style="margin-top:16px"><button class="btn primary" style="width:100%">Entrar</button></div></form></div>`;
  $('#pf').onsubmit = e => { e.preventDefault(); if(hashStr(e.target.pin.value.trim().toLowerCase()) === PIN_HASH){ AUTH = true; const d = ls.get(DRAFT_KEY, null); if(d && d.V){ V = d.V; STEP = d.STEP || 0; } render(); } else toast('Contraseña incorrecta'); };
}
let HTAB = 'tablero';
const pctS = (n, d) => d ? Math.round(n / d * 100) + '%' : '–';
const barsHTML = (rows, total, color) => rows.length ? `<div class="bars">${rows.map(([l, n]) => `<div class="br"><div class="lb"><span>${esc(l)}</span><b>${n} · ${pctS(n, total)}</b></div><div class="bt"><i style="width:${total ? n / total * 100 : 0}%;--c:${color}"></i></div></div>`).join('')}</div>` : '<p class="empty">Todavía no hay datos.</p>';
const countBy = (L, f) => { const m = {}; L.forEach(v => [].concat(f(v) || []).forEach(k => { if(k) m[k] = (m[k] || 0) + 1; })); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
function renderHome(){
  nav(`<button class="btn primary" id="bNew">＋ Nueva visita</button>`);
  $('#bNew').onclick = () => { V = newVisit(); STEP = 0; save(); render(); };
  const L = Object.entries(VIS).map(([k, v]) => ({ k, ...v })).sort((a, b) => (b.fin || 0) - (a.fin || 0));
  const q = ls.get(QUEUE_KEY, []), n = L.length;
  const pend = q.length ? `<div class="warnbox">${q.length} ${q.length === 1 ? 'visita pendiente' : 'visitas pendientes'} de subir (sin señal). Se suben solas cuando vuelva internet.</div>` : '';
  let body = '';
  if(HTAB === 'tablero'){
    const usa = L.filter(v => v.uso === 'si').length, enc = L.filter(v => v.encuesta === 'si').length;
    const citas = L.flatMap(v => (v.citas || []).map(c => ({ ...c, negocio:v.negocio, uso:v.uso }))).slice(0, 10);
    body = `<div class="kpis"><div class="kpi"><b>${n}</b><small>Visitas hechas</small></div><div class="kpi"><b>${pctS(usa, n)}</b><small>Usa Tokin</small></div><div class="kpi"><b>${pctS(enc, n)}</b><small>Hizo la encuesta</small></div></div>
      ${pend}
      <div class="card"><div class="eyebrow" style="margin-bottom:12px">Temas que más mencionan</div>${barsHTML(countBy(L, v => v.temas), n, 'var(--cyan)')}</div>
      <div class="card"><div class="eyebrow" style="margin-bottom:12px;color:var(--red)">Alertas</div>${barsHTML(countBy(L, v => v.alertas), n, 'var(--red)')}</div>
      <div class="card"><div class="eyebrow" style="margin-bottom:12px;color:var(--amber)">⭐ Citas destacadas</div>${citas.length ? citas.map(c => `<div class="cita"><span><q>${esc(c.t)}</q><small>${esc(c.negocio || '')} · ${esc((USO.find(u => u[0] === c.uso) || [, ''])[1])}</small></span></div>`).join('') : '<p class="empty">Todavía no hay citas. Guardalas con la estrella durante la visita.</p>'}</div>
      <div class="card"><div class="eyebrow" style="margin-bottom:12px;color:var(--violet)">Quiénes visitamos</div>${barsHTML(countBy(L, v => (USO.find(u => u[0] === v.uso) || [, 'Sin dato'])[1]), n, 'var(--violet)')}
        <div class="eyebrow" style="margin:18px 0 12px;color:var(--violet)">Por distribuidor</div>${barsHTML(countBy(L, v => v.distribuidor || 'Sin distribuidor'), n, 'var(--blue)')}</div>
      <div class="row"><button class="btn" id="bXls" ${n ? '' : 'disabled'} style="flex:1">⬇ Exportar Excel</button><a class="btn" href="${ENCUESTA_URL}" target="_blank" rel="noopener" style="flex:1">Abrir encuesta ↗</a></div>`;
  } else {
    body = `${pend}<div class="card"><div class="eyebrow" style="margin-bottom:12px">${n} ${n === 1 ? 'visita guardada' : 'visitas guardadas'}</div>
      ${n ? `<div class="list">${L.slice(0, 100).map(v => `<div class="vis"><div><b>${esc(v.negocio || 'Sin nombre')}</b><small>${esc(v.distribuidor || '–')} · ${esc((USO.find(u => u[0] === v.uso) || [, '–'])[1])} · ${v.fin ? new Date(v.fin).toLocaleString('es-AR',{ day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : ''}${v.visitante ? ' · ' + esc(v.visitante) : ''}${(v.citas || []).length ? ' · ⭐ ' + v.citas.length : ''}</small></div>
        <button class="trash" data-del="${esc(v.k)}" title="Eliminar">🗑</button></div>`).join('')}</div>` : '<p class="empty">Todavía no hay visitas.</p>'}</div>
      <div class="row"><button class="btn" id="bXls" ${n ? '' : 'disabled'} style="flex:1">⬇ Exportar Excel</button></div>`;
  }
  $('#app').innerHTML = `<div class="tabs"><button data-ht="tablero" class="${HTAB === 'tablero' ? 'on' : ''}">📊 Tablero</button><button data-ht="lista" class="${HTAB === 'lista' ? 'on' : ''}">📋 Visitas (${n})</button></div>${body}`;
  document.querySelectorAll('[data-ht]').forEach(b => b.onclick = () => { HTAB = b.dataset.ht; renderHome(); });
  if($('#bXls')) $('#bXls').onclick = exportXls;
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if(!b.dataset.c){ b.dataset.c = 1; b.textContent = '¿?'; b.style.color = 'var(--red)'; return; }
    try{ const r = await fetch(api('/visitas/' + b.dataset.del), { method:'DELETE' }); if(!r.ok) throw 0; delete VIS[b.dataset.del]; toast('Visita eliminada'); render(); }catch(e){ toast('No se pudo eliminar'); }
  });
}
function renderFicha(){
  $('#app').innerHTML = `<div class="card"><div class="eyebrow">Paso 1 · Datos del PDV</div><h1>¿Dónde estás?</h1>
    <label class="f">Nombre del negocio <b>*</b></label><input class="inp" data-k="negocio" value="${esc(V.negocio)}" placeholder="Ej.: Kiosco Ana" autocomplete="off">
    <label class="f">Dirección</label><input class="inp" data-k="direccion" value="${esc(V.direccion)}" placeholder="Calle y número" autocomplete="off">
    <label class="f">Distribuidor que lo atiende</label><input class="inp" data-k="distribuidor" value="${esc(V.distribuidor)}" autocomplete="off">
    <label class="f">¿Usa Tokin? <b>*</b></label><div class="seg">${USO.map(u => `<button data-uso="${u[0]}" class="${V.uso === u[0] ? 'on' : ''}">${u[1]}</button>`).join('')}</div>
    <label class="f">Quién hace la visita</label><input class="inp" data-k="visitante" value="${esc(V.visitante)}" placeholder="Tu nombre" autocomplete="off">
    <p class="note">Según si usa o no Tokin, la guía te muestra las preguntas que corresponden.</p></div>`;
  const ok = () => V.negocio.trim().length >= 2 && V.uso;
  nav(`<button class="btn back" id="bCancel">Cancelar</button><button class="btn primary" id="bNext">Empezar preguntas →</button>`);
  const upd = () => { $('#bNext').disabled = !ok(); };
  document.querySelectorAll('[data-k]').forEach(i => i.oninput = () => { V[i.dataset.k] = i.value; if(i.dataset.k === 'visitante') ls.set('tokinVisitante', i.value); save(); upd(); });
  document.querySelectorAll('[data-uso]').forEach(b => b.onclick = () => { V.uso = b.dataset.uso; save(); renderFicha(); });
  $('#bCancel').onclick = () => { if(confirmLeave()) { V = null; ls.set(DRAFT_KEY, null); render(); } };
  $('#bNext').onclick = () => { STEP = 1; save(); render(); }; upd();
}
const confirmLeave = () => { const b = $('#bCancel'); if(b && !b.dataset.c && (Object.keys(V.a).length || V.negocio)){ b.dataset.c = 1; b.textContent = '¿Descartar?'; b.style.color = 'var(--red)'; return false; } return true; };
function renderQ(q, i, n){
  $('#app').innerHTML = `<div class="prog"><div class="bar"><i style="width:${i / (n + 1) * 100}%"></i></div><span>${i} / ${n}</span></div>
    <div class="card"><span class="sec">${esc(q.sec)}</span><div class="q">${esc(q.t)}</div><div class="tipq">Leéla tal cual. Si responde corto, repreguntá: "¿y qué pasó?"</div>
      <div class="rec"><button class="mic" id="mic" aria-label="Grabar"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg></button><div class="recst" id="recst"></div></div>
      <textarea class="tr" id="ta" placeholder="Acá aparece lo que dice el PDV. También podés escribir o corregir.">${esc(V.a[q.id] || '')}</textarea>
      <div class="interim" id="interim"></div>
      <div class="follow" id="follow" data-q="${q.id}" hidden></div>
      <div class="qtools"><button class="btn star" id="bStar" data-q="${q.id}"></button></div>
      <div class="note" style="margin-top:6px">Guarda la última frase. Para elegir otra, seleccioná el texto y tocá la estrella.</div>
      <div class="tags" id="tags"></div></div>`;
  nav(`<button class="btn back" id="bBack">←</button><button class="btn primary" id="bNext">${i === n ? 'Terminar →' : 'Siguiente →'}</button>`);
  $('#mic').onclick = () => recOn ? stopRec() : startRec(q.id);
  $('#bStar').onclick = () => addCita(q.id);
  $('#ta').oninput = e => { V.a[q.id] = e.target.value; save(); paintTags(); };
  $('#bBack').onclick = () => { STEP--; save(); render(); window.scrollTo(0, 0); };
  $('#bNext').onclick = () => { STEP++; save(); render(); window.scrollTo(0, 0); };
  paintRec(); paintTags(); paintStar();
}
function renderFin(){
  const Qs = qsFor(V.uso), t = temas(Object.values(V.a).join(' '));
  $('#app').innerHTML = `<div class="card"><div class="eyebrow">Último paso</div><h1>${esc(V.negocio)}</h1>
      <label class="f">¿Hizo la encuesta del focus group?</label><div class="seg" style="grid-template-columns:repeat(2,1fr)">${[['si','Sí'],['no','No']].map(o => `<button data-enc="${o[0]}" class="${V.encuesta === o[0] ? 'on' : ''}">${o[1]}</button>`).join('')}</div>
      <a class="btn" style="width:100%;margin-top:10px" href="${ENCUESTA_URL}" target="_blank" rel="noopener">Abrir la encuesta para el PDV ↗</a>
      <label class="f">Observaciones tuyas (opcional)</label><textarea class="tr" id="obs" style="min-height:90px" placeholder="Lo que viste: dudas, gestos, cómo usa el celular…">${esc(V.obs || '')}</textarea>
      ${t.pos.length || t.neg.length ? `<label class="f">Temas que mencionó</label><div class="tags">${[...t.pos.map(x => `<span class="tag">${esc(x)}</span>`), ...t.neg.map(x => `<span class="tag neg">${esc(x)}</span>`)].join('')}</div>` : ''}</div>
    ${(V.citas || []).length ? `<div class="card"><div class="eyebrow">⭐ Citas destacadas</div>${V.citas.map((c, i) => `<div class="cita"><span><q>${esc(c.t)}</q><small>${esc((QS.find(x => x.id === c.q) || {}).t || '')}</small></span><button data-dc="${i}" title="Quitar">✕</button></div>`).join('')}</div>` : ''}
    <div class="card sum"><div class="eyebrow">Resumen de respuestas</div>${Qs.map(q => `<div class="qq">${esc(q.t)}</div><p>${esc(V.a[q.id] || '—')}</p>`).join('')}</div>`;
  nav(`<button class="btn back" id="bBack">←</button><button class="btn primary" id="bSave">✓ Guardar visita</button>`);
  document.querySelectorAll('[data-enc]').forEach(b => b.onclick = () => { V.encuesta = b.dataset.enc; save(); document.querySelectorAll('[data-enc]').forEach(x => x.classList.toggle('on', x === b)); });
  $('#obs').oninput = e => { V.obs = e.target.value; save(); };
  document.querySelectorAll('[data-dc]').forEach(b => b.onclick = () => { V.citas.splice(+b.dataset.dc, 1); save(); renderFin(); });
  $('#bBack').onclick = () => { STEP--; save(); render(); };
  $('#bSave').onclick = saveVisit;
}

/* ---------- guardar en Firebase (con cola si no hay señal) ---------- */
function payload(v){ const Qs = qsFor(v.uso), t = temas(Object.values(v.a).join(' ')); const a = {}; Qs.forEach(q => { if(v.a[q.id]) a[q.id] = v.a[q.id].slice(0, 4000); });
  return { negocio:v.negocio.trim().slice(0, 80), direccion:(v.direccion || '').trim().slice(0, 120), distribuidor:(v.distribuidor || '').trim().slice(0, 80), visitante:(v.visitante || '').trim().slice(0, 60),
    uso:v.uso, encuesta:v.encuesta || '', citas:(v.citas || []).slice(0, 30).map(c => ({ q:c.q, t:String(c.t).slice(0, 500) })), obs:(v.obs || '').slice(0, 2000), a, temas:t.pos, alertas:t.neg, start:v.start, fin:Date.now(), dur:Math.round((Date.now() - v.start) / 1000) }; }
async function putVisit(id, body){ const r = await fetch(api('/visitas/' + id), { method:'PUT', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body) }); if(!r.ok) throw new Error(r.status); }
async function saveVisit(){
  stopRec(); const b = $('#bSave'); b.disabled = true; b.textContent = 'Guardando…';
  const id = V.id, body = payload(V);
  try{ await putVisit(id, body); VIS[id] = body; toast('✓ Visita guardada'); }
  catch(e){ const q = ls.get(QUEUE_KEY, []); q.push({ id, body }); ls.set(QUEUE_KEY, q); toast('Sin señal: la visita quedó guardada en el celular y se sube sola después.'); }
  V = null; STEP = 0; ls.set(DRAFT_KEY, null); render(); window.scrollTo(0, 0);
}
async function flushQueue(){ const q = ls.get(QUEUE_KEY, []); if(!q.length) return; const rest = [];
  for(const it of q){ try{ await putVisit(it.id, it.body); VIS[it.id] = it.body; }catch(e){ rest.push(it); } }
  ls.set(QUEUE_KEY, rest); if(rest.length < q.length && !V && AUTH) render(); }
async function load(){
  const s = $('#sync');
  try{ const r = await fetch(api('/visitas'), { cache:'no-store' }); if(!r.ok) throw new Error(r.status); const t = await r.text(); VIS = (t && JSON.parse(t)) || {}; s.className = 'pill ok'; s.querySelector('span').textContent = 'Conectado'; }
  catch(e){ s.className = 'pill warn'; s.querySelector('span').textContent = 'Sin conexión'; }
  await flushQueue(); if(AUTH && !V) render();
}
addEventListener('online', load);

/* ---------- Excel ---------- */
function loadXlsx(){ return window.XLSX ? Promise.resolve() : new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function exportXls(){
  const L = Object.entries(VIS).map(([k, v]) => ({ k, ...v })).sort((a, b) => (a.fin || 0) - (b.fin || 0));
  const rows = L.map(v => { const o = { 'Fecha':v.fin ? new Date(v.fin).toLocaleString('es-AR') : '', 'Negocio':v.negocio, 'Dirección':v.direccion, 'Distribuidor':v.distribuidor, 'Usa Tokin':(USO.find(u => u[0] === v.uso) || [, ''])[1], 'Visitante':v.visitante, 'Hizo la encuesta':v.encuesta === 'si' ? 'Sí' : v.encuesta === 'no' ? 'No' : '', 'Duración (min)':v.dur ? Math.round(v.dur / 6) / 10 : '' };
    QS.forEach(q => { o[q.t] = (v.a || {})[q.id] || ''; }); o['Citas'] = (v.citas || []).map(c => '“' + c.t + '”').join('  '); o['Temas mencionados'] = (v.temas || []).join(', '); o['Alertas'] = (v.alertas || []).join(', '); o['Observaciones'] = v.obs || ''; return o; });
  const largo = []; L.forEach(v => QS.forEach(q => { const t = (v.a || {})[q.id]; if(t) largo.push({ 'Negocio':v.negocio, 'Distribuidor':v.distribuidor, 'Usa Tokin':(USO.find(u => u[0] === v.uso) || [, ''])[1], 'Sección':q.sec, 'Pregunta':q.t, 'Respuesta del PDV':t }); }));
  const temasCount = {}; L.forEach(v => [...(v.temas || []), ...(v.alertas || [])].forEach(t => temasCount[t] = (temasCount[t] || 0) + 1));
  const res = Object.entries(temasCount).sort((a, b) => b[1] - a[1]).map(([t, n]) => ({ 'Tema':t, 'Visitas que lo mencionan':n, '%':L.length ? Math.round(n / L.length * 100) + '%' : '' }));
  try{ await loadXlsx(); const wb = XLSX.utils.book_new();
    const add = (name, data) => { const ws = XLSX.utils.json_to_sheet(data.length ? data : [{ 'Sin datos':'' }]); ws['!cols'] = Object.keys(data[0] || { a:1 }).map(k => ({ wch: Math.min(60, Math.max(12, k.length + 2)) })); XLSX.utils.book_append_sheet(wb, ws, name); };
    const citas = []; L.forEach(v => (v.citas || []).forEach(c => citas.push({ 'Cita':c.t, 'Negocio':v.negocio, 'Distribuidor':v.distribuidor, 'Usa Tokin':(USO.find(u => u[0] === v.uso) || [, ''])[1], 'Pregunta':(QS.find(q => q.id === c.q) || {}).t || '' })));
    add('Visitas', rows); add('Citas destacadas', citas); add('Respuestas', largo); add('Temas', res);
    XLSX.writeFile(wb, `visitas-pdv-tokin-${new Date().toISOString().slice(0, 10)}.xlsx`); }
  catch(e){ toast('No se pudo generar el Excel. Revisá la conexión.'); }
}

render(); load();
